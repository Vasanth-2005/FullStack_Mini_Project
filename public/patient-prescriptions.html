<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Prescriptions - LifeCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .dashboard-container { display: flex; min-height: 100vh; }
        .sidebar { width: 250px; background: rgba(15, 23, 42, 0.95); border-right: 1px solid var(--border-color); padding: 2rem 1rem; display: flex; flex-direction: column; }
        .sidebar h2 { text-align: center; margin-bottom: 2rem; font-size: 1.5rem; }
        .sidebar a { color: var(--text-muted); text-decoration: none; padding: 1rem; border-radius: 8px; margin-bottom: 0.5rem; transition: all 0.3s; display: block; }
        .sidebar a:hover, .sidebar a.active { background: rgba(59, 130, 246, 0.1); color: var(--primary); }
        .main-content { flex: 1; padding: 2rem 5%; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
        
        .prescription-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--glass-shadow);
        }
        .presc-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        .med-list {
            list-style: none;
            margin-left: 0;
            padding-left: 0;
        }
        .med-list li {
            background: rgba(15, 23, 42, 0.5);
            padding: 1rem;
            margin-bottom: 0.5rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
        }
        .med-name { color: var(--text-main); font-weight: 600;}
        .med-dose { color: var(--secondary); font-size: 0.9rem;}
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2><span class="highlight">Life</span>Care</h2>
            <a href="patient-dashboard.html">Dashboard</a>
            <a href="#" onclick="alert('Please use the main Dashboard to book.')">Book Appointment</a>
            <a href="patient-records.html">My Records</a>
            <a href="patient-prescriptions.html" class="active">Prescriptions</a>
            <a href="patient-pharmacy.html">Pharmacy</a>`n            <a href="patient-invoices.html">Invoices</a>
            <div style="flex: 1;"></div>
            <a href="patient-ambulance.html" class="sos-link" style="color:#ef4444;">?? Emergency SOS</a>`n            <a href="#" onclick="logout()">Logout</a>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="top-bar">
                <h1>Active Prescriptions</h1>
                <div class="user-profile">
                    <div class="doctor-avatar" style="width: 40px; height: 40px; font-size: 1rem; margin: 0;">P</div>
                </div>
            </div>

            <div id="prescriptionsWrapper">
                <p style="text-align:center; color: var(--text-muted); padding: 2rem;">Loading dynamic prescriptions...</p>
            </div>
        </main>
    </div>
    <script>
        const userData = JSON.parse(localStorage.getItem('user'));
        if (!userData || !userData.id) {
            alert('Please login to view your secure prescriptions.');
            window.location.href = 'login.html';
        }

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        async function loadPrescriptions() {
            try {
                const response = await fetch('/api/patient-stats/' + userData.id);
                if (response.ok) {
                    const data = await response.json();
                    const container = document.getElementById('prescriptionsWrapper');
                    container.innerHTML = '';
                    
                    const withPrescriptions = data.appointments.filter(a => a.prescription_text);
                    
                    if (withPrescriptions.length === 0) {
                        container.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding:3rem;">No active prescriptions found. Your doctor has not issued any prescriptions yet.</p>';
                        return;
                    }

                    withPrescriptions.forEach((app, idx) => {
                        const dateStr = new Date(app.date).toISOString().split('T')[0];
                        const prescHtml = app.prescription_text.replace(/\n/g, '<br>');
                        
                        window['prescData' + idx] = `LifeCare Hospital\n========================\nOfficial Prescription\nDoctor: ${app.doctor}\nDate Issued: ${dateStr}\nDiagnosed Problem: ${app.reason || 'General Checkup'}\n\nPrescribed Medications & Notes:\n${app.prescription_text}\n\nElectronically Signed.\nNotes: Please complete the entire advised course.`;

                        container.innerHTML += `
                        <div class="prescription-card">
                            <div class="presc-header">
                                <div>
                                    <h3 style="color: var(--text-main); margin-bottom: 0.5rem;">${app.doctor}</h3>
                                    <p style="color: var(--text-muted); font-size: 0.9rem;">${app.dept || 'General'} Department</p>
                                </div>
                                <div style="text-align: right;">
                                    <span style="background: rgba(16, 185, 129, 0.2); color: #10b981; padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.8rem; font-weight: 600;">Active Script</span>
                                    <p style="color: var(--text-muted); font-size: 0.8rem; margin-top: 0.5rem;">Issued: ${dateStr}</p>
                                </div>
                            </div>
                            
                            <div style="background: rgba(15, 23, 42, 0.5); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border-color); color: var(--text-main); line-height: 1.6; margin-bottom: 1.5rem;">
                                ${prescHtml}
                            </div>
                            
                            <button class="btn-outline" style="width: 100%; margin-top: 0.5rem;" onclick="downloadSecurePrescription(${idx}, '${app.doctor}')">Download Verified Prescription (TXT)</button>
                        </div>
                        `;
                    });
                } else {
                    document.getElementById('prescriptionsWrapper').innerHTML = '<p style="color: red; text-align:center;">Failed to load data natively.</p>';
                }
            } catch(e) {
                console.error('Error fetching dynamic prescriptions', e);
                document.getElementById('prescriptionsWrapper').innerHTML = '<p style="color: red; text-align:center;">Server connection failed natively.</p>';
            }
        }

        function downloadSecurePrescription(idx, docName) {
            const content = window['prescData' + idx];
            const blob = new Blob([content], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `Prescription_${docName.replace(/[^a-zA-Z0-9]/g, '_')}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        loadPrescriptions();
    </script>
    <script src="js/bg-slider.js"></script>
</body>
</html>
