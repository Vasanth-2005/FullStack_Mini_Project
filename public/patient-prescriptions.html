<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeCare | Digital Prescriptions</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        :root {
            --presc-primary: #8b5cf6;
            --presc-accent: #3b82f6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #050d1a;
            color: #f1f5f9;
            margin: 0;
            overflow-x: hidden;
        }

        .dashboard-container { display: flex; min-height: 100vh; }

        /* Sidebar - Consistent */
        .sidebar {
            width: 260px;
            background: rgba(10, 18, 38, 0.98);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            padding: 2.5rem 1.5rem;
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar h2 {
            font-size: 1.6rem;
            font-weight: 800;
            margin-bottom: 2.5rem;
            letter-spacing: -0.5px;
        }
        .sidebar h2 span { color: var(--presc-primary); }

        .nav-links { flex: 1; }
        .nav-links a {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            padding: 0.9rem 1.2rem;
            border-radius: 12px;
            margin-bottom: 0.4rem;
            font-weight: 500;
            font-size: 0.92rem;
            transition: all 0.25s;
        }

        .nav-links a:hover, .nav-links a.active {
            background: rgba(139, 92, 246, 0.1);
            color: white;
        }

        .nav-links a.active {
            background: linear-gradient(90deg, rgba(139, 92, 246, 0.2), transparent);
            border-left: 3px solid var(--presc-primary);
        }

        .sos-link { color: #f87171 !important; border: 1px solid rgba(248, 113, 113, 0.2); margin-top: 1.5rem; }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 260px;
            padding: 3rem 4%;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 3.5rem;
        }

        .header-bar h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(135deg, #fff 40%, var(--presc-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Prescription Cards */
        .presc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 2rem;
        }

        .presc-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 2.5rem;
            position: relative;
            transition: all 0.3s;
            overflow: hidden;
        }

        .presc-card:hover {
            border-color: rgba(139, 92, 246, 0.4);
            transform: translateY(-5px);
            background: rgba(30, 41, 59, 0.8);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        .presc-card::after {
            content: '℞';
            position: absolute;
            top: -10px;
            right: 10px;
            font-size: 8rem;
            color: rgba(139, 92, 246, 0.05);
            font-family: serif;
            pointer-events: none;
        }

        .presc-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 1.5rem;
        }

        .doc-info h3 { margin: 0 0 0.3rem; font-size: 1.3rem; }
        .doc-info p { margin: 0; color: rgba(255, 255, 255, 0.4); font-size: 0.9rem; }

        .date-badge {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            text-align: center;
        }

        .date-badge .day { font-size: 1.2rem; font-weight: 800; display: block; }
        .date-badge .mon { font-size: 0.7rem; text-transform: uppercase; opacity: 0.5; }

        .presc-body {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            min-height: 120px;
            border: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .med-line {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }

        .med-line span { color: var(--presc-primary); }

        .presc-footer {
            display: flex;
            gap: 1rem;
        }

        .btn-glass {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0.8rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .btn-primary-glass {
            background: rgba(139, 92, 246, 0.15);
            border-color: rgba(139, 92, 246, 0.3);
            color: var(--presc-primary);
        }

        .btn-primary-glass:hover {
            background: var(--presc-primary);
            color: white;
        }

        /* ── Transitions ── */
        .fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2><span>Life</span>Care</h2>
            <nav class="nav-links">
                <a href="patient-dashboard.html">🏠 Dashboard</a>
                <a href="patient-ai-checker.html">🧠 AI Diagnostic</a>
                <a href="patient-telemedicine.html">📹 Live Telemedicine</a>
                <a href="patient-records.html">📁 My Records</a>
                <a href="patient-lab-reports.html">🔬 Lab Reports</a>
                <a href="patient-prescriptions.html" class="active">📝 Prescriptions</a>
                <a href="patient-pharmacy.html">💊 Pharmacy Shop</a>
                <a href="patient-invoices.html">💳 Invoices</a>
                <a href="emergency.html" class="sos-link">🚑 Emergency SOS</a>
            </nav>
            <a href="#" onclick="logout()" style="opacity: 0.5; margin-top: auto;">🚪 Logout</a>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="header-bar fade-in">
                <div>
                    <h1>My Prescriptions</h1>
                    <p style="color: rgba(255,255,255,0.4); margin-top: 0.4rem;">Access your verified medical scripts and digital refills.</p>
                </div>
                <div class="user-profile">
                    <div class="doc-avatar" id="userAvatar">P</div>
                </div>
            </div>

            <div id="prescriptionsWrapper" class="presc-grid fade-in" style="animation-delay: 0.2s;">
                <!-- Loaded via JS -->
                <p style="text-align:center; color: var(--text-muted); padding: 2rem;">Fetching digital records...</p>
            </div>
        </main>
    </div>

    <script>
        const userData = JSON.parse(localStorage.getItem('user'));
        if (!userData || !userData.id) window.location.href = 'login.html';
        else document.getElementById('userAvatar').innerText = userData.name.charAt(0).toUpperCase();

        function logout() {
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        async function loadPrescriptions() {
            try {
                const response = await fetch('/api/patient-stats/' + userData.id);
                if (response.ok) {
                    const data = await response.json();
                    const container = document.getElementById('prescriptionsWrapper');
                    container.innerHTML = '';
                    
                    const withPrescriptions = data.appointments.filter(a => a.prescription_text);
                    
                    if (withPrescriptions.length === 0) {
                        container.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 5rem 0;"><p style="color: rgba(255,255,255,0.3); font-size: 1.2rem;">No active digital prescriptions found.</p></div>';
                        return;
                    }

                    withPrescriptions.forEach((app, idx) => {
                        const date = new Date(app.date);
                        const day = date.getDate();
                        const mon = date.toLocaleString('default', { month: 'short' });
                        
                        const lines = app.prescription_text.split('\n');
                        let linesHtml = lines.map(l => `<div class="med-line"><span>⚡</span> ${l}</div>`).join('');

                        container.innerHTML += `
                        <div class="presc-card fade-in">
                            <div class="presc-header">
                                <div class="doc-info">
                                    <h3>${app.doctor}</h3>
                                    <p>${app.dept || 'General'} Specialist</p>
                                </div>
                                <div class="date-badge">
                                    <span class="day">${day}</span>
                                    <span class="mon">${mon}</span>
                                </div>
                            </div>
                            
                            <div class="presc-body">
                                ${linesHtml}
                            </div>
                            
                            <div class="presc-footer">
                                <button class="btn-glass" onclick="downloadPresc('${app.doctor}', '${app.prescription_text}')">📄 Download TXT</button>
                                <button class="btn-glass btn-primary-glass" onclick="window.location.href='patient-pharmacy.html'">🛒 Order Refill</button>
                            </div>
                        </div>
                        `;
                    });
                }
            } catch(e) {
                console.error(e);
            }
        }

        function downloadPresc(doc, text) {
            const content = `LIFECARE DIGITAL PRESCRIPTION\n============================\nDOCTOR: ${doc}\nDATE: ${new Date().toLocaleDateString()}\nPATIENT: ${userData.name}\n\nRX:\n${text}\n\n[Verified Digital Signature]`;
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Prescription_${doc.replace(/\s+/g, '_')}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        loadPrescriptions();
    </script>
    <script src="js/bg-slider.js"></script>
</body>
</html>
