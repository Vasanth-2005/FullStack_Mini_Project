<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Services - LifeCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .em-container { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; background: radial-gradient(circle at center, rgba(239, 68, 68, 0.15) 0%, var(--bg-dark) 60%); }
        .em-card { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 20px; padding: 4rem 3rem; max-width: 700px; box-shadow: 0 0 40px rgba(239, 68, 68, 0.2); }
        .em-icon { font-size: 5rem; margin-bottom: 1rem; animation: pulse 2s infinite; }
        .em-title { color: #f87171; font-size: 3rem; margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 2px; }
        .em-desc { color: var(--text-muted); font-size: 1.2rem; margin-bottom: 3rem; line-height: 1.6; }
        .em-numbers { display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; }
        .em-num-box { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.4); padding: 1.5rem 2.5rem; border-radius: 12px; min-width: 250px; }
        .em-num-box h4 { color: white; margin-bottom: 0.5rem; font-size: 1.1rem; }
        .em-num-box .number { color: #facc15; font-size: 2.5rem; font-weight: 800; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .back-btn { margin-top: 3rem; background: transparent; border: 1px solid var(--border-color); color: var(--text-main); padding: 0.8rem 2rem; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.3s; }
        .back-btn:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div class="em-container">
        <div class="em-card">
            <div class="em-icon">🚑</div>
            <h1 class="em-title">24/7 Emergency</h1>
            <p class="em-desc">If you are experiencing a life-threatening medical emergency, please call for immediate assistance. Our Level 1 Trauma Care Unit is actively on standby.</p>
            
            <div class="em-numbers">
                <div class="em-num-box">
                    <h4>Ambulance Direct Line</h4>
                    <div class="number">911</div>
                </div>
                <div class="em-num-box">
                    <h4>Trauma Center Hotline</h4>
                    <div class="number">800-LIFE</div>
                </div>
            </div>

            <a href="index.html" class="back-btn">Return to Home</a>
        </div>
    </div>
    <script src="js/bg-slider.js"></script>
</body>
</html>
