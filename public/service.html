<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Services - LifeCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .service-container { padding: 6rem 5%; min-height: 80vh; max-width: 1200px; margin: 0 auto; display: flex; gap: 4rem; align-items: center; }
        @media (max-width: 900px) { .service-container { flex-direction: column; text-align: center; } }
        
        .service-info { flex: 1; }
        .service-info h1 { font-size: 3.5rem; margin-bottom: 1rem; background: linear-gradient(to right, #ffffff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .service-info p { color: var(--text-muted); font-size: 1.2rem; line-height: 1.8; margin-bottom: 2rem; }
        .service-features { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 3rem; }
        .feature-item { background: rgba(30, 41, 59, 0.5); padding: 1rem; border-radius: 8px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 0.8rem; }
        .feature-item i { color: var(--primary); font-size: 1.2rem; }

        .service-visual { flex: 1; display: flex; justify-content: center; }
        .visual-card { width: 100%; max-width: 400px; aspect-ratio: 1; background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9)); border: 1px solid var(--border-color); border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 8rem; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .visual-card h3 { font-size: 1.5rem; color: var(--text-main); margin-top: 1rem; font-weight: 400; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <h2><span class="highlight">Life</span>Care</h2>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="index.html#home">Home</a></li>
                <li><a href="index.html#services" class="highlight">Services</a></li>
                <li><a href="index.html#doctors">Our Doctors</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <div class="auth-buttons">
            <button class="btn-primary" onclick="checkLoginForBooking()">Book Appointment</button>
        </div>
    </header>

    <main class="service-container">
        <div class="service-info">
            <h1 id="deptTitle">Department Details</h1>
            <p id="deptDesc">Specialized care and advanced treatment options tailored to your specific medical needs.</p>
            
            <div class="service-features" id="deptFeatures">
                <!-- Features injected by JS -->
            </div>

            <button class="btn-primary" style="padding: 1rem 2rem; font-size: 1.1rem;" onclick="checkLoginForBooking()">Schedule Consultation</button>
        </div>

        <div class="service-visual">
            <div class="visual-card">
                <div id="deptIcon">ðŸ¥</div>
                <h3 id="deptBadge">Specialty Care</h3>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const dept = urlParams.get('dept');

            const contentMap = {
                'cardiology': {
                    title: 'Cardiology Institute',
                    desc: 'Our world-class Cardiology center is equipped with cutting-edge hemodynamic monitoring systems and offers comprehensive care targeting complex cardiovascular diseases, preventive cardiology, and post-surgery rehabilitation.',
                    icon: '❤️',
                    badge: 'Heart Care',
                    features: ['24/7 Cath Lab', 'Echocardiograms', 'Arrhythmia Treatment', 'Cardiac Surgery']
                },
                'neurology': {
                    title: 'Neurology Department',
                    desc: 'The Neurology Department provides expert diagnosis and management of brain and nervous system disorders. We utilize high-resolution neuroimaging to precisely target and treat stroke, epilepsy, and neurodegenerative conditions.',
                    icon: '🧠',
                    badge: 'Brain Care',
                    features: ['Advanced MRI Profiling', 'Stroke Unit', 'Spinal Interventions', 'Sleep Medicine']
                },
                'orthopedics': {
                    title: 'Orthopedics Center',
                    desc: 'Providing total joint replacement, sports medicine, and spinal injury trauma care. Our orthopedic surgeons utilize minimally invasive techniques to drastically reduce recovery times for complex bone and muscle conditions.',
                    icon: '🦴',
                    badge: 'Bone & Joint',
                    features: ['Joint Replacement', 'Sports Medicine', 'Physiotherapy', 'Trauma Surgery']
                },
                'pediatrics': {
                    title: 'Pediatrics Department',
                    desc: 'Compassionate medical care for infants, children, and adolescents. Our specialists provide comprehensive immunizations, developmental assessments, and childhood disease management.',
                    icon: '👶',
                    badge: 'Child Care',
                    features: ['Vaccinations', 'Growth Monitoring', 'Allergy Testing', 'Neonatal Intensive Care']
                },
                'dermatology': {
                    title: 'Dermatology Clinic',
                    desc: 'Expert diagnosis and treatment for all conditions related to skin, hair, and nails. We offer medical and cosmetic treatments utilizing state-of-the-art laser therapies.',
                    icon: '✨',
                    badge: 'Skin Health',
                    features: ['Laser Therapy', 'Acne Treatment', 'Skin Cancer Screening', 'Cosmetic Dermatology']
                }
            };

            const data = contentMap[dept];
            
            if (data) {
                document.getElementById('deptTitle').textContent = data.title;
                document.getElementById('deptDesc').textContent = data.desc;
                document.getElementById('deptIcon').textContent = data.icon;
                document.getElementById('deptBadge').textContent = data.badge;

                const featuresDiv = document.getElementById('deptFeatures');
                data.features.forEach(f => {
                    featuresDiv.innerHTML += `
                        <div class="feature-item">
                            <i>✔️</i> <span>${f}</span>
                        </div>
                    `;
                });
            } else {
                document.getElementById('deptTitle').textContent = "Service Not Found";
            }
        });
        
        function checkLoginForBooking() {
            const user = JSON.parse(localStorage.getItem('user'));
            if (!user || Object.keys(user).length === 0) {
                alert("Please complete the Secure Login to access the Scheduling Interface.");
                window.location.href = 'login.html';
            } else {
                window.location.href = 'patient-dashboard.html';
            }
        }
    </script>
    <script src="js/bg-slider.js"></script>
</body>
</html>
