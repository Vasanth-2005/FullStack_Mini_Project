<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LifeCare Hospital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="auth-body">
    <div class="auth-container glass-card">
        <div class="auth-header">
            <h2><span class="highlight">Life</span>Care Login</h2>
            <p>Welcome back! Please login to your account.</p>
        </div>
        
        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            
            <div id="loginError" class="error-msg" style="display: none;"></div>
            
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
        </form>
        
        <div class="auth-footer">
            <p>Don't have an account? <a href="register.html" class="highlight">Register Here</a></p>
            <p><a href="index.html" class="text-muted">Back to Home</a></p>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/bg-slider.js"></script>
</body>
</html>
